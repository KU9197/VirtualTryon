
<!DOCTYPE html>
<html>
<head>
  <title>JEELIZ VTO WIDGET INTEGRATION DEMO</title>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
  />

  <script src="dist/JeelizVTOWidget.js"></script>

  <script
    defer
    src="https://use.fontawesome.com/releases/v5.0.6/js/all.js"
  ></script>

  <link
    href="https://fonts.googleapis.com/css?family=Roboto+Condensed"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="css/JeelizVTOWidget.css"
  />

  <script>
    let _isResized = false;

    // Resize the camera widget
    function test_resizeCanvas() {
      const halfHeightPx =
        Math.round(window.innerHeight / 2) + 'px';

      const domWidget =
        document.getElementById('JeelizVTOWidget');

      domWidget.style.maxHeight =
        _isResized ? 'none' : halfHeightPx;

      _isResized = !_isResized;
    }

    // Check whether shadows should be displayed
    function get_isShadow() {
      const params = new URLSearchParams(
        window.location.search
      );

      return !params.get('isHideShadow');
    }

    // Check HTTPS for camera access
    function check_secure_context() {
      const isLocalhost = [
        'localhost',
        '127.0.0.1',
        '::1'
      ].includes(window.location.hostname);

      if (!window.isSecureContext && !isLocalhost) {
        alert(
          'This application requires HTTPS to access the camera.'
        );
        return false;
      }

      return true;
    }

    // Display initialization errors
    function showError(message) {
      console.error('Virtual Try-On Error:', message);

      const loadingText = document.querySelector(
        '.JeelizVTOWidgetLoadingText'
      );

      if (loadingText) {
        loadingText.textContent = 'ERROR: ' + message;
      }
    }

    // Main application
    function main() {
      if (!check_secure_context()) {
        return;
      }

      // Read the sunglasses SKU from the URL
      const params = new URLSearchParams(
        window.location.search
      );

      const sku = params.get('sku');

      console.log('Selected SKU:', sku || 'default');

      // Configure Jeeliz
      const options = {
        isRequestCamera: true,
        isShadow: get_isShadow(),
        searchImageMask: 'images/target.png',
        searchImageColor: 0xeeeeee,

        // Called when camera access succeeds
        onWebcamGet: function () {
          console.log('Camera stream acquired');
        },

        // Called when Jeeliz is ready
        callbackReady: function () {
          console.log(
            'INFO: JEELIZVTOWIDGET is ready :)'
          );

          // Without a SKU, load the default local model
          if (!sku) {
            console.log('Loading default sunglasses');

            JEELIZVTOWIDGET.load_modelStandalone(
              'glasses3D/glasses1.json'
            );
          }
        },

        // Handle errors
        onError: function (errorLabel) {
          console.error('Jeeliz error:', errorLabel);

          if (errorLabel === 'INVALID_SKU') {
            console.warn(
              'Invalid SKU. Loading default model.'
            );

            JEELIZVTOWIDGET.load_modelStandalone(
              'glasses3D/glasses1.json'
            );

            return;
          }

          showError(errorLabel);
        }
      };

      // Set the initial sunglasses model
      if (sku) {
        options.sku = sku;
        console.log('Requesting sunglasses:', sku);
      }

      // Start Jeeliz only once
      JEELIZVTOWIDGET.start(options);
    }
  </script>
</head>

<body onload="main()">

  <div class="content">

    <div class="header">
      <div class="headerTitle">
        Jeeliz VTO Widget
      </div>
    </div>

    <div id="JeelizVTOWidget">

      <!-- Camera canvas -->
      <canvas id="JeelizVTOWidgetCanvas"></canvas>

      <!-- Top controls -->
      <div class="JeelizVTOWidgetControls JeelizVTOWidgetControlsTop">

        <button id="JeelizVTOWidgetAdjust">
          <div class="buttonIcon">
            <i class="fas fa-arrows-alt"></i>
          </div>
          Adjust
        </button>

        <button
          id="buttonResizeCanvas"
          onclick="test_resizeCanvas();"
        >
          <div class="buttonIcon">
            <i class="fas fa-sync-alt"></i>
          </div>
          Resize widget
        </button>

      </div>

      <!-- Glasses adjustment notice -->
      <div id="JeelizVTOWidgetAdjustNotice">
        Move the glasses to adjust them.

        <button
          class="JeelizVTOWidgetBottomButton"
          id="JeelizVTOWidgetAdjustExit"
        >
          Quit
        </button>
      </div>

      <!-- Loading screen -->
      <div id="JeelizVTOWidgetLoading">
        <div class="JeelizVTOWidgetLoadingText">
          LOADING...
        </div>
      </div>

    </div>

  </div>

</body>
</html>
